<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Settlement &amp; PRF Reconciliation Tool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%BE%3C/text%3E%3C/svg%3E">

<body><div id="root"></div><script>
/* ===== Reconciliation engine (pure JS, no DOM) ===== */
const COMPS=['Loan','DFS','CRN','ADJ'];
const COMP_LABEL={Loan:'Loan',DFS:'DFS',CRN:'Credit Note',ADJ:'Adjustment'};
const PREFIX_COMP={LON:'Loan',DFS:'DFS',CRN:'CRN',ADJ:'ADJ'};
const SETTLED_FIELDS={code:['request code'],company:['company'],nid:['employee id','national id','nid'],nid2:['account owner nid'],name:['english name','employee name','name'],reqType:['request type'],subType:['sub-request type','sup-request type','subrequest type','sub request type'],remarks:['remarks'],comment:['finance comment'],loan:['loan amount'],dfs:['dfs amount'],crn:['credit note amount'],adj:['adjustment amount'],total:['total deductions'],status:['final status'],dRel:['bank released at'],dOps:['ops approval date'],dRev:['reviewer approval date'],dCre:['original request created.','original request created']};
const PRF_FIELDS={nid:['national id','nid','employee id'],company:['company'],name:['english name','name'],amount:['settlement amount'],loan:['loan'],crn:['credit note'],dfs:['dfs'],adj:['adjustment'],remarks:['remarks'],code:['settlement code'],status:['settlement status']};
const REQUIRED={settled:['code','nid','loan','dfs','crn','adj','status'],prf:['nid','code','amount','loan','crn','dfs','adj']};
const norm=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9\u0600-\u06ff.]+/g,' ').trim();
function autoMap(headers,fields){const m={},h=headers.map(norm);for(const f in fields){const i=h.findIndex(x=>fields[f].includes(x));m[f]=i<0?null:headers[i];}return m;}
function findHeaderRow(rows,fields){let best=0,bs=-1;for(let i=0;i<Math.min(rows.length,15);i++){const m=autoMap((rows[i]||[]).map(x=>x==null?'':String(x)),fields);const sc=Object.values(m).filter(Boolean).length;if(sc>bs){bs=sc;best=i;}}return best;}
const str=v=>v==null?'':String(v).trim();
const nid=v=>{if(v==null||v==='')return '';if(typeof v==='number')return String(Math.round(v));return String(v).replace(/\.0+$/,'').replace(/\D/g,'');};
const toC=v=>{if(v==null||v==='')return 0;const n=typeof v==='number'?v:Number(String(v).replace(/[, ]/g,''));return isFinite(n)?Math.round(n*100):0;};
const toMs=v=>{if(v==null||v==='')return null;if(v instanceof Date)return isNaN(v)?null:v.getTime();if(typeof v==='number')return Math.round((v-25569)*864e5);const d=Date.parse(v);return isNaN(d)?null:d;};
const seqOf=c=>{const m=String(c).match(/(\d+)\s*$/);return m?+m[1]:0;};
const coKey=(code,co)=>{const m=String(code).match(/^([A-Z]+)-/);return m?m[1]:str(co).slice(0,12).toUpperCase();};
const typeOf=(code,rt)=>{const m=String(code).match(/-(LON|DFS|CRN|ADJ|SET)-/);if(m)return m[1];const t=norm(rt);return t.startsWith('loan')?'LON':t.startsWith('deduction')?'DFS':t.startsWith('credit')?'CRN':t.startsWith('adj')?'ADJ':t.startsWith('settle')?'SET':'';};
const REFRE=/(?:[A-Z]{2,5})-FD-(?:LON|DFS|CRN|ADJ)-\d+/g;

async function analyze({settled,prf,sMap,pMap,opts,progress,info}){
  const gi=n=>(info&&info[n])||{};
  const issues=[],stats={settledRows:settled.length,prfRows:prf.length,excluded:{}};
  const iss=(sev,type,msg,o={})=>issues.push({sev,type,msg,code:o.code||'',key:o.key||'',person:!!o.person});
  const gs=(r,f)=>sMap[f]==null?undefined:r[sMap[f]], gp=(r,f)=>pMap[f]==null?undefined:r[pMap[f]];
  const ledgers=new Map(),byCode=new Map(),names=new Map();
  const L=k=>{if(!ledgers.has(k))ledgers.set(k,{key:k,nid:'',name:'',charges:[],sets:[]});return ledgers.get(k);};
  const okStatus=new Set(opts.statuses.map(norm));
  const seenCodes=new Set();
  // ---- 1. read Settled
  settled.forEach((r,i)=>{
    const code=str(gs(r,'code')),status=str(gs(r,'status'));
    if(!okStatus.has(norm(status))){const k=status||'(blank)';stats.excluded[k]=(stats.excluded[k]||0)+1;return;}
    if(!code){iss('error','Missing Code',`صف ${i+2} في Settled بدون Request Code`);return;}
    if(seenCodes.has(code)){iss('error','Duplicate Code',`الكود ${code} مكرر في Settled — تم تجاهل التكرار`,{code});return;}
    seenCodes.add(code);
    let n=nid(gs(r,'nid'));const n2=nid(gs(r,'nid2'));if(!n&&n2)n=n2;
    const type=typeOf(code,gs(r,'reqType'));
    const name=str(gs(r,'name'));
    if(!n){iss('error','Missing NID',`الكود ${code} بدون National ID — لا يمكن ربطه بشخص`,{code});return;}
    const key=n+'|'+coKey(code,gs(r,'company'));
    const lg=L(key);lg.nid=n;
    if(name){if(lg.name&&lg.name!==name)iss('warn','Name Mismatch',`اختلاف اسم لنفس الهوية ${n}: «${lg.name}» / «${name}»`,{key,code,person:true});else lg.name=name;}
    if(n.length!==10)iss('warn','Invalid NID',`هوية غير قياسية الطول (${n.length} خانة) للكود ${code}`,{key,code,person:true});
    const dates=[['Bank Released',toMs(gs(r,'dRel'))],['Ops Approval',toMs(gs(r,'dOps'))],['Reviewer Approval',toMs(gs(r,'dRev'))],['Request Created',toMs(gs(r,'dCre'))]].find(d=>d[1]!=null);
    const date=dates?dates[1]:null,dateSrc=dates?dates[0]:'';
    const rec={code,seq:seqOf(code),type,key,date,dateSrc,sub:str(gs(r,'subType')),remarks:str(gs(r,'remarks')),comment:str(gs(r,'comment')),flags:[]};
    const cv={Loan:toC(gs(r,'loan')),DFS:toC(gs(r,'dfs')),CRN:toC(gs(r,'crn')),ADJ:toC(gs(r,'adj'))};
    const rt=typeOf('',gs(r,'reqType'));if(rt&&type&&rt!==type)iss('warn','Type Mismatch',`الكود ${code}: نوع العملية (${gs(r,'reqType')}) لا يطابق بادئة الكود`,{code,key});
    if(date==null)iss('warn','Unclear Date',`الكود ${code} بدون تاريخ واضح`,{code,key}),rec.flags.push('no-date');
    else if(dateSrc!=='Bank Released')rec.flags.push('date-fallback');
    if(type==='SET'){
      rec.comps={};let sum=0;
      for(const c of COMPS){if(cv[c]<0){rec.comps[c]=-cv[c];sum+=-cv[c];}else if(cv[c]>0)iss('warn','Positive in SET',`التسوية ${code}: قيمة موجبة في ${COMP_LABEL[c]} — تم تجاهلها`,{code,key});}
      if(!sum)iss('warn','Empty Settlement',`التسوية ${code} بدون مبالغ`,{code,key});
      const tot=toC(gs(r,'total'));if(tot&&sMap.total&&Math.abs(tot-sum)>1)iss('warn','Total Mismatch',`التسوية ${code}: Total Deductions ≠ مجموع المكونات`,{code,key});
      rec.refs=[];lg.sets.push(rec);byCode.set(code,rec);
    }else if(PREFIX_COMP[type]){
      const comp=PREFIX_COMP[type],amt=cv[comp];
      const other=COMPS.filter(c=>c!==comp&&cv[c]!==0);
      if(other.length)iss('warn','Type Mismatch',`الكود ${code} (${type}) يحمل مبالغ في مكونات أخرى: ${other.join(', ')} — تم تجاهلها`,{code,key});
      if(amt<0){iss('error','Negative Amount',`الكود ${code}: مبلغ سالب`,{code,key});return;}
      if(amt===0){iss('warn','No Amount',`الكود ${code} بدون مبلغ`,{code,key});return;}
      Object.assign(rec,{comp,amt,paid:0,remaining:amt,hist:[]});lg.charges.push(rec);
      const found=(rec.remarks+' '+rec.comment).match(REFRE);if(found)rec.xref=found;
    }else iss('warn','Unknown Type',`الكود ${code}: نوع العملية غير معروف`,{code,key});
  });
  // explicit references inside SET remarks (confirmed basis)
  const chargeCodes=new Set();ledgers.forEach(l=>l.charges.forEach(c=>chargeCodes.add(c.code)));
  ledgers.forEach(l=>l.sets.forEach(s=>{const f=(s.remarks+' '+s.comment).match(REFRE);if(f)s.refs=[...new Set(f)].filter(c=>chargeCodes.has(c));}));
  // ---- 2. read PRF → target settlements
  const targets=[];
  prf.forEach((r,i)=>{
    const code=str(gp(r,'code')),st=str(gp(r,'status'));
    const loan=toC(gp(r,'loan')),dfs=toC(gp(r,'dfs')),crn=toC(gp(r,'crn')),adj=toC(gp(r,'adj')),amt=toC(gp(r,'amount'));
    if(!code&&!nid(gp(r,'nid'))&&!amt)return;
    if(!code){iss('error','Missing Settlement Code',`صف ${i+2} في PRF بدون Settlement Code`);return;}
    let n=nid(gp(r,'nid'));let s=byCode.get(code);
    if(!n&&s)n=ledgers.get(s.key).nid,iss('warn','Missing NID',`PRF ${code} بدون National ID — استُخدمت هوية Settled`,{code});
    if(!n){iss('error','Missing NID',`PRF ${code} بدون National ID`,{code});return;}
    const comps={Loan:loan,DFS:dfs,CRN:crn,ADJ:adj};
    if([loan,dfs,crn,adj,amt].some(x=>x<0))iss('error','Negative Amount',`PRF ${code}: مبالغ سالبة`,{code});
    const sum=loan+dfs+crn+adj;
    if(Math.abs(sum-amt)>1)iss('error','Distribution Mismatch',`PRF ${code}: Settlement Amount (${amt/100}) ≠ مجموع المكونات (${sum/100})`,{code});
    if(norm(st)&&norm(st)!=='settled')iss('warn','Status',`PRF ${code}: الحالة «${st}»`,{code});
    const key=n+'|'+coKey(code,gp(r,'company'));
    const nm=str(gp(r,'name'));
    if(s){
      if(s.key!==key)iss('error','NID Mismatch',`PRF ${code}: الهوية في PRF تختلف عن Settled`,{code,key});
      const diff=COMPS.some(c=>(s.comps[c]||0)!==comps[c]);
      if(diff)iss('warn','PRF vs Settled',`PRF ${code}: توزيع المكونات يختلف عن المسجل في Settled — اعتُمدت قيم PRF`,{code,key});
      s.comps={};COMPS.forEach(c=>{if(comps[c]>0)s.comps[c]=comps[c];});
    }else{
      iss('warn','Code Not in Settled',`Settlement Code ${code} غير موجود في Settled — يُعامل كأحدث عملية`,{code,key});
      s={code,seq:seqOf(code),type:'SET',key,date:null,dateSrc:'',remarks:'',comment:'',flags:['virtual'],comps:{},refs:[]};
      COMPS.forEach(c=>{if(comps[c]>0)s.comps[c]=comps[c];});
      const lg=L(key);lg.nid=n;if(!lg.name)lg.name=nm;lg.sets.push(s);byCode.set(code,s);
    }
    const lg=ledgers.get(s.key);if(nm&&lg.name&&nm!==lg.name)iss('warn','Name Mismatch',`PRF ${code}: الاسم «${nm}» ≠ «${lg.name}»`,{key:s.key,code,person:true});
    s.target=true;s.prfAmount=amt;targets.push(s);
  });
  // date filter
  const from=opts.from?new Date(opts.from+'T00:00:00').getTime():-Infinity,to=opts.to?new Date(opts.to+'T23:59:59').getTime():Infinity;
  targets.forEach(s=>{s.inRange=s.date==null||(s.date>=from&&s.date<=to);});
  // ---- 3. replay FIFO per person
  const rows=[],audit=[],sSum=[];const keys=[...ledgers.keys()];let done=0;
  const sdate=s=>s.date==null?Infinity:s.date;
  for(const key of keys){
    const lg=ledgers.get(key);
    if(!lg.sets.some(s=>s.target)){done++;continue;}
    lg.charges.sort((a,b)=>(a.date??-Infinity)-(b.date??-Infinity)||a.seq-b.seq);
    lg.sets.sort((a,b)=>sdate(a)-sdate(b)||a.seq-b.seq);
    for(const s of lg.sets){
      if(!s.target&&opts.prev==='ignore')continue;
      s.alloc=[];s.left={};
      for(const comp of COMPS){
        let rem=s.comps[comp]||0;if(!rem)continue;const req=rem;
        const pool=lg.charges.filter(c=>c.comp===comp);
        const avail0=pool.filter(c=>c.remaining>0&&(opts.future||c.date==null||c.date<=sdate(s))).reduce((a,c)=>a+c.remaining,0);
        const take=(c,basis)=>{const t=Math.min(rem,c.remaining);if(t<=0)return;s.alloc.push({c,comp,t,basis,prev:c.paid,orig:c.amt});c.hist.push({set:s.code,date:s.date,amt:t,basis});c.paid+=t;c.remaining-=t;rem-=t;};
        (s.refs||[]).forEach(code=>{const c=pool.find(x=>x.code===code&&x.remaining>0);if(c&&rem>0)take(c,'REF');});
        for(const c of pool){if(rem<=0)break;if(c.remaining>0&&(c.date==null||c.date<=sdate(s)))take(c,'FIFO');}
        if(rem>0&&opts.future)for(const c of pool){if(rem<=0)break;if(c.remaining>0)take(c,'FIFO-FUTURE');}
        s.left[comp]=rem;
        if(s.target)audit.push({settlement:s.code,nid:lg.nid,component:COMP_LABEL[comp],step:`مبلغ ${COMP_LABEL[comp]}: ${req/100} | رصيد مؤهل قبل التسوية (تاريخ ≤ ${s.date==null?'غير محدد':new Date(s.date).toISOString().slice(0,16).replace('T',' ')}): ${avail0/100} | موزّع: ${(req-rem)/100} | متبقٍ بلا مقابل: ${rem/100}`,rule:'FIFO — الأقدم أولاً (تاريخ Bank Released ثم رقم الكود)'});
      }
    }
    // build output for targets
    for(const s of lg.sets){
      if(!s.target)continue;
      const tot=COMPS.reduce((a,c)=>a+(s.comps[c]||0),0),left=COMPS.reduce((a,c)=>a+(s.left[c]||0),0),matched=tot-left;
      const codes=new Set(s.alloc.map(a=>a.c.code));if(info&&!info[lg.nid]&&s.inRange)iss('warn','No PRF Info',`Settlement ${s.code}: الرقم الوطني ${lg.nid} غير موجود في شيت PRF — لا توجد City/Company`,{code:s.code,key});
      const rv=issues.some(i=>(i.code===s.code&&i.sev!=='info')||(i.person&&i.key===key))||s.alloc.some(a=>a.c.flags.length);
      const tags=[];
      const main=!tot?'Unmatched':left===0?'Fully Matched':matched>0?'Partially Matched':'Unmatched';
      if(codes.size>1)tags.push('Multiple Codes');if(left>0)tags.push('Overpayment');if(rv)tags.push('Needs Review');
      const conf=s.alloc.filter(a=>a.basis==='REF').reduce((a,x)=>a+x.t,0);
      const sm={code:s.code,sub:s.sub||'',key,nid:lg.nid,city:gi(lg.nid).city||'',company:gi(lg.nid).company||'',name:lg.name,date:s.date,virtual:!!s.virtual,inRange:s.inRange,total:tot,matched,left,status:main,tags,codes:codes.size,confirmed:conf,inferred:matched-conf};
      sSum.push(sm);if(!s.inRange)continue;
      for(const a of s.alloc){audit.push({settlement:s.code,nid:lg.nid,component:COMP_LABEL[a.comp],step:`${a.c.code}: أصلي ${a.orig/100} | خصم سابق ${a.prev/100} | خصم حالي ${a.t/100} | متبقٍ ${(a.orig-a.prev-a.t)/100}${a.c.flags.length?' | ⚠ '+a.c.flags.join(','):''}`,rule:a.basis==='REF'?'مرجع مباشر في Remarks/Comment (مؤكد)':a.basis==='FIFO'?'استنتاج FIFO (غير مؤكد)':'FIFO على مديونية لاحقة للتسوية (يحتاج مراجعة)'});
        rows.push({name:lg.name,nid:lg.nid,city:sm.city,company:sm.company,key,settlement:s.code,sDate:s.date,code:a.c.code,type:a.c.type,sub:a.c.sub,comp:a.comp,orig:a.orig,prev:a.prev,cur:a.t,rem:a.orig-a.prev-a.t,basis:a.basis,cDate:a.c.date,status:sm.status,tags});}
      for(const c of COMPS)if(s.left[c]>0)rows.push({name:lg.name,nid:lg.nid,city:sm.city,company:sm.company,key,settlement:s.code,sDate:s.date,code:'— بلا مقابل —',type:c==='Loan'?'LON':c==='CRN'?'CRN':c,comp:c,orig:0,prev:0,cur:s.left[c],rem:0,basis:'NONE',cDate:null,status:sm.status,tags,unmatched:true});
    }
    if(++done%200===0){progress&&progress(done/keys.length);await new Promise(r=>setTimeout(r,0));}
  }
  // ---- 4. employees + totals
  const emp=new Map();
  for(const sm of sSum){if(!sm.inRange)continue;if(!emp.has(sm.key)){const lg=ledgers.get(sm.key);emp.set(sm.key,{key:sm.key,nid:lg.nid,city:sm.city,company:sm.company,name:lg.name,charges:lg.charges,sets:lg.sets,bal:{},unalloc:0});}}
  emp.forEach(e=>{COMPS.forEach(c=>e.bal[c]=e.charges.filter(x=>x.comp===c).reduce((a,x)=>a+x.remaining,0));e.unalloc=e.sets.reduce((a,s)=>a+COMPS.reduce((b,c)=>b+((s.left||{})[c]||0),0),0);});
  const inr=sSum.filter(s=>s.inRange);
  const T={settle:0,matched:0,left:0};inr.forEach(s=>{T.settle+=s.total;T.matched+=s.matched;T.left+=s.left;});
  const cur=rows.reduce((a,r)=>a+r.cur,0);
  const check={ok:cur===T.settle&&rows.filter(r=>!r.unmatched).reduce((a,r)=>a+r.cur,0)===T.matched,rowsTotal:cur,settleTotal:T.settle};
  if(!check.ok)iss('error','Total Mismatch','إجمالي Settlement لا يطابق إجمالي التوزيع — راجع Audit Trail');
  stats.excludedTotal=Object.values(stats.excluded).reduce((a,b)=>a+b,0);
  progress&&progress(1);
  return {rows,settlements:inr,employees:[...emp.values()],issues,audit,totals:{...T,employees:emp.size,codes:new Set(rows.filter(r=>!r.unmatched).map(r=>r.code)).size,full:inr.filter(s=>s.status==='Fully Matched').length,partial:inr.filter(s=>s.status==='Partially Matched').length,unmatched:inr.filter(s=>s.status==='Unmatched').length,count:inr.length},check,stats};
}

const {useState,useMemo,useEffect,useRef}=React;const html=htm.bind(React.createElement);
const M=n=>(n/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const D=ms=>ms==null||ms===Infinity?'—':new Date(ms).toISOString().slice(0,16).replace('T',' ');
const CARD='rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-900';
const INP='rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-800';
const BTN='rounded-lg px-4 py-2 text-sm font-semibold transition';
const ST={'Fully Matched':'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300','Partially Matched':'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300','Unmatched':'bg-rose-100 text-rose-800 dark:bg-rose-900/40 dark:text-rose-300','Multiple Codes':'bg-sky-100 text-sky-800 dark:bg-sky-900/40 dark:text-sky-300','Needs Review':'bg-orange-100 text-orange-800 dark:bg-orange-900/40 dark:text-orange-300','Overpayment':'bg-fuchsia-100 text-fuchsia-800 dark:bg-fuchsia-900/40 dark:text-fuchsia-300'};
const Badge=({t})=>html`<span class=${'inline-block whitespace-nowrap rounded-full px-2 py-0.5 text-xs font-medium '+(ST[t]||'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300')}>${t}</span>`;
const BasisB=({b})=>b==='REF'?html`<${Badge} t="مؤكد (مرجع مباشر)"/>`:b==='NONE'?html`<span class="text-slate-400">—</span>`:html`<span class=${'whitespace-nowrap rounded px-1.5 py-0.5 text-xs '+(b==='FIFO'?'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300':'bg-orange-100 text-orange-700')}>${b==='FIFO'?'استنتاجي FIFO':'FIFO لاحق ⚠'}</span>`;
const DEF={from:'',to:'',comps:{Loan:true,DFS:true,CRN:true,ADJ:true},prev:'infer',future:false,statuses:['Approved']};
function loadOpts(){try{return {...DEF,...JSON.parse(localStorage.getItem('spr-opts')||'{}')};}catch(e){return DEF;}}

const TRE=t=>{const x=String(t||'').toLowerCase();return x.includes('alpha')?'ALPHA':x.includes('gbe')?'GAMMA':x.includes('kul')?'BETA':'';};
async function readBook(file,F){
  const buf=await file.arrayBuffer();let wb;
  if(/\.(csv|tsv|txt)$/i.test(file.name||'')){let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){t=new TextDecoder('windows-1256').decode(buf);}
    wb=XLSX.read(t.replace(/^\uFEFF/,''),{type:'string',cellDates:true});}
  else wb=XLSX.read(buf,{type:'array',cellDates:true});
